[package]
name = "maplibre-expr"
description = "Pure-Rust parser and evaluator for MapLibre GL style expressions"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reearth/maplibre-expr-rs"
homepage = "https://github.com/reearth/maplibre-expr-rs"
authors = ["Re:Earth and contributors"]
keywords = ["maplibre", "mapbox", "expression", "style", "gis"]
categories = ["parsing", "graphics"]
readme = "README.md"
exclude = ["/.github", "/tests/fixtures"]

[lib]
name = "maplibre_expr"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["collator"]
# Locale-aware `collator` comparisons, backed by CLDR data from ICU4X. Without
# it the `collator` expression still parses and type-checks; comparisons fall
# back to code-point order.
collator = ["dep:icu_collator", "dep:icu_locale_core"]

[dependencies]
# `serde` itself is deliberately not a direct dependency: nothing here derives
# or names it, and depending on it with `derive` would build serde_derive (and
# syn / quote) on every build for nothing. `serde_json::Value` is the only
# serde-side type this crate uses, and serde_json re-exports what it needs.
serde_json = "1"
# Pulled in directly rather than through the `icu` meta-crate, which would also
# build the datetime, segmenter, calendar, list and plurals data crates.
icu_collator = { version = "2", features = ["compiled_data"], optional = true }
icu_locale_core = { version = "2", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "spec"
harness = false
